[package]
name = "backend_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.5"
tokio = { version = "1.38", features = ["full"] }
tower-http = { version = "0.5.2", features = ["cors", "limit"] }
tower = "0.4.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.5", features = ["json", "stream"] }
dotenvy = "0.15.7"
tokio-stream = "0.1.15"
futures-util = "0.3.30"
swiss-eph = "0.2.1"
chrono = "0.4.44"
chrono-tz = "0.10.4"
tzf-rs = "1.3.3"
once_cell = "1.21.4"
rusqlite = { version = "0.31.0", features = ["bundled"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
async-stream = "0.3.6"
