name: Build Android Native APK with Rust

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-rust-and-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk || true

      - name: Compile Rust .so libraries for Android
        run: |
          cd backend_rust
          export NDK_HOME="${ANDROID_NDK_HOME}"
          cargo ndk --platform 24 -t arm64-v8a -t x86_64 -o ../android/app/src/main/jniLibs build --release

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VedicJyotish-Rust-Native-APK
          path: android/app/build/outputs/apk/debug/*.apk
